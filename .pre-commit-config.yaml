# 설치는 각자 한다: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # 웹 쪽은 apps/web의 설정과 의존성을 그대로 쓰도록 pnpm 스크립트를 부른다.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (apps/web)
        entry: corepack pnpm --dir apps/web lint
        language: system
        files: ^apps/web/
        pass_filenames: false
      - id: prettier
        name: prettier (apps/web)
        entry: corepack pnpm --dir apps/web format:check
        language: system
        files: ^apps/web/
        pass_filenames: false
