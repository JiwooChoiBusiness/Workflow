# 린트와 테스트만 돈다. 이미지 푸시와 배포는 하지 않는다(ADR-0002).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.0"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      # 알려진 취약점 경고는 빌드를 막지 않는다. 결과를 보고 사람이 판단한다(설계 M10.1 (9)).
      - run: uv export --frozen --no-hashes --no-emit-workspace -o requirements-audit.txt
      - run: uvx pip-audit -r requirements-audit.txt
        continue-on-error: true
      # 메모리 기준은 windows 잡의 값이고 여기 값은 참고다. 둘 다 예산을 넘으면 실패한다(설계 2.7).
      - run: uv run python scripts/memcheck.py

  # Job Object·PowerShell 실제 동작은 Windows에서만 확인된다(설계 12.1 Q6). windows 마커까지 전부 돈다.
  # live(실제 Gemini 호출)는 키가 없어 뺀다.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.0"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -m "not live"
      - run: uv run python scripts/memcheck.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
        continue-on-error: true
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Playwright 스모크(설계 7.6, 2단계 M20). 러너에 깔린 Edge를 쓰고 가짜 어댑터 서버를 8502에 띄운다.
  # 각본 서버가 필요한 orchestration.spec은 스스로 건너뛴다. 실패하면 서버 로그를 남긴다.
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.0"
          python-version: "3.12"
      - run: uv sync --locked
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
      - name: 시험 서버 띄우기
        shell: bash
        run: |
          export SERVER_PORT=8502 DATA_DIR="$RUNNER_TEMP/e2e-data" LLM_FAKE=true GEMINI_API_KEYS=, PYTHONUTF8=1
          # dsl.spec이 비밀 환경 변수를 저장하므로 일회용 키를 만든다.
          export ENCRYPTION_KEY="$(uv run python -c 'import base64,secrets;print(base64.b64encode(secrets.token_bytes(32)).decode())')"
          nohup uv run platform serve > "$RUNNER_TEMP/e2e-server.log" 2>&1 &
          for _ in $(seq 1 90); do
            curl -sf http://127.0.0.1:8502/healthz > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/e2e-server.log"
          exit 1
      - run: pnpm e2e
        working-directory: apps/web
      - if: failure()
        shell: bash
        run: tail -n 200 "$RUNNER_TEMP/e2e-server.log"
