# 저장소 루트에서 실행한다:
#   docker compose --env-file .env -f infra/docker/compose.yaml up -d --build
# --env-file을 빼면 GATEWAY_HTTP_PORT와 POSTGRES_* 치환에 루트 .env가 쓰이지 않는다.
name: workflow

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 20s

x-platform-api: &platform-api
  image: platform-api:dev
  build:
    context: ../..
    dockerfile: infra/docker/api.Dockerfile
  env_file: ../../.env
  restart: unless-stopped
  volumes:
    - storage:/data

services:
  gateway:
    image: platform-gateway:dev
    build:
      context: ../..
      dockerfile: infra/docker/gateway.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-8080}:80"
    networks: [app-net]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]

  api:
    <<: *platform-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "5001"]
    networks: [app-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/readyz', timeout=3)

  runner:
    <<: *platform-api
    command: ["python", "-m", "app.runner"]
    networks: [app-net, sandbox-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      # runner는 수신 포트가 없다. 하트비트 파일이 30초 넘게 갱신되지 않으면 비정상으로 본다.
      test:
        - CMD
        - python
        - -c
        - import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/runner-heartbeat') > 30)

  sandbox-manager:
    <<: *platform-api
    command: ["python", "-m", "app.sandbox_manager"]
    networks: [app-net, sandbox-net]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:7100/healthz', timeout=3)

  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    restart: unless-stopped
    volumes:
      - ../egress/squid.conf:/etc/squid/squid.conf:ro
      - ../egress/allowlist.txt:/etc/squid/allowlist.txt:ro
      - egress-logs:/var/log/squid
    networks: [sandbox-net, egress-net]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]

  postgres:
    image: postgres:16
    restart: unless-stopped
    # .env 전체를 넘기지 않는다. Postgres에는 LLM 키 같은 값이 필요 없다.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 넣고 --env-file .env로 실행한다}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [app-net]
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks: [app-net]
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]

networks:
  app-net: {}
  # 외부 라우트가 없다. 샌드박스는 egress-proxy를 거쳐야만 밖으로 나간다.
  sandbox-net:
    internal: true
  egress-net: {}

volumes:
  pgdata: {}
  redisdata: {}
  storage: {}
  egress-logs: {}
