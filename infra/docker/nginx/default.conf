server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # 에이전트 첨부 파일 상한(100MB)에 멀티파트 여유를 더했다.
    client_max_body_size 110m;

    # api 컨테이너가 다시 만들어져 IP가 바뀌어도 따라가도록 요청 시점에 Docker DNS로 이름을 푼다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:5001;

    # 내부 API는 서비스 간 호출 전용이다.
    location /internal {
        deny all;
    }

    location = /api/healthz {
        proxy_pass $api_upstream/healthz;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE를 모아 두지 않고 바로 흘려보낸다. 런은 수십 분 갈 수 있다.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
