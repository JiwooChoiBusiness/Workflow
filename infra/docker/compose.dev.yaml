# 개발용 덧씌우기. api와 runner는 소스를 마운트하고 코드가 바뀌면 다시 뜬다.
#   docker compose --env-file .env -f infra/docker/compose.yaml -f infra/docker/compose.dev.yaml up -d --build
services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "5001", "--reload"]
    environment:
      # Windows 경로를 바인드 마운트하면 inotify 이벤트가 오지 않아 폴링으로 감시한다.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../../apps/api/app:/srv/api/app

  runner:
    command: ["watchfiles", "--target-type", "command", "--filter", "python", "python -m app.runner", "app"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../../apps/api/app:/srv/api/app
