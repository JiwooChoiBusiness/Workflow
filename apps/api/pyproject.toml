[project]
name = "platform-api"
version = "0.1.0"
description = "API, 에이전트 러너, 화면 정적 서빙을 한 프로세스에서 돌리는 플랫폼 서버"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "openai>=3.29.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
platform = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
