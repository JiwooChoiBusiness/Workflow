# Dify DSL 구조(공개 문서의 app·workflow.graph.nodes[].data)를 보고 직접 쓴 작은 예제.
# 지원 노드만 쓴 워크플로우: start, http-request, code(python3), if-else, template-transform, llm,
# variable-aggregator, end. 캔버스 메모, 플러그인 의존성, 비밀 환경 변수가 함께 들어 있다.
app:
  description: 검색어로 외부 API를 부르고 결과를 요약한다
  icon: 🔎
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 검색 요약
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: example/openai:0.1.0
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: 검색 API 키
    id: 6f1e2d3c-0000-4000-8000-000000000001
    name: SEARCH_KEY
    selector:
    - env
    - SEARCH_KEY
    value: ''
    value_type: secret
  - description: ''
    id: 6f1e2d3c-0000-4000-8000-000000000002
    name: SEARCH_BASE
    selector:
    - env
    - SEARCH_BASE
    value: https://search.example.com
    value_type: string
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: http-request
      id: 1720000000001-source-1720000000002-target
      source: '1720000000001'
      sourceHandle: source
      target: '1720000000002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: http-request
        targetType: code
      id: 1720000000002-source-1720000000003-target
      source: '1720000000002'
      sourceHandle: source
      target: '1720000000003'
      targetHandle: target
      type: custom
    - data:
        sourceType: code
        targetType: if-else
      id: 1720000000003-source-1720000000004-target
      source: '1720000000003'
      sourceHandle: source
      target: '1720000000004'
      targetHandle: target
      type: custom
    - data:
        sourceType: if-else
        targetType: template-transform
      id: 1720000000004-true-1720000000005-target
      source: '1720000000004'
      sourceHandle: 'true'
      target: '1720000000005'
      targetHandle: target
      type: custom
    - data:
        sourceType: if-else
        targetType: template-transform
      id: 1720000000004-false-1720000000007-target
      source: '1720000000004'
      sourceHandle: 'false'
      target: '1720000000007'
      targetHandle: target
      type: custom
    - data:
        sourceType: template-transform
        targetType: llm
      id: 1720000000005-source-1720000000006-target
      source: '1720000000005'
      sourceHandle: source
      target: '1720000000006'
      targetHandle: target
      type: custom
    - data:
        sourceType: llm
        targetType: variable-aggregator
      id: 1720000000006-source-1720000000008-target
      source: '1720000000006'
      sourceHandle: source
      target: '1720000000008'
      targetHandle: target
      type: custom
    - data:
        sourceType: template-transform
        targetType: variable-aggregator
      id: 1720000000007-source-1720000000008-target
      source: '1720000000007'
      sourceHandle: source
      target: '1720000000008'
      targetHandle: target
      type: custom
    - data:
        sourceType: variable-aggregator
        targetType: end
      id: 1720000000008-source-1720000000009-target
      source: '1720000000008'
      sourceHandle: source
      target: '1720000000009'
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: ''
        selected: false
        title: 시작
        type: start
        variables:
        - label: 검색어
          max_length: 100
          options: []
          required: true
          type: text-input
          variable: keyword
        - label: 언어
          options:
          - ko
          - en
          required: false
          type: select
          variable: lang
      height: 116
      id: '1720000000001'
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config:
            api_key: '{{#env.SEARCH_KEY#}}'
            type: bearer
          type: api-key
        body:
          data: []
          type: none
        desc: ''
        headers: Accept:application/json
        method: get
        params: 'q:{{#1720000000001.keyword#}}

          lang:{{#1720000000001.lang#}}'
        retry_config:
          enabled: true
          max_retries: 2
          retry_interval: 500
        selected: false
        timeout:
          connect: 10
          read: 30
          write: 30
        title: 검색 API
        type: http-request
        url: '{{#env.SEARCH_BASE#}}/v1/search'
        variables: []
      height: 140
      id: '1720000000002'
      position:
        x: 384
        y: 282
      type: custom
      width: 244
    - data:
        code: "import json\n\n\ndef main(body: str) -> dict:\n    data = json.loads(body\
          \ or \"{}\")\n    titles = [item.get(\"title\", \"\") for item in data.get(\"\
          items\", [])]\n    return {\"titles\": titles, \"count\": len(titles)}\n"
        code_language: python3
        desc: ''
        outputs:
          count:
            children: null
            type: number
          titles:
            children: null
            type: array[string]
        selected: false
        title: 결과 정리
        type: code
        variables:
        - value_selector:
          - '1720000000002'
          - body
          variable: body
      height: 54
      id: '1720000000003'
      position:
        x: 688
        y: 282
      type: custom
      width: 244
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: '>'
            id: 1d6a9c2e-0000-4000-8000-00000000000a
            value: '0'
            varType: number
            variable_selector:
            - '1720000000003'
            - count
          id: 'true'
          logical_operator: and
        desc: ''
        selected: false
        title: 결과가 있나
        type: if-else
      height: 126
      id: '1720000000004'
      position:
        x: 992
        y: 282
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        template: '{% for t in titles %}- {{ t }}

          {% endfor %}'
        title: 목록 글
        type: template-transform
        variables:
        - value_selector:
          - '1720000000003'
          - titles
          variable: titles
      height: 54
      id: '1720000000005'
      position:
        x: 1296
        y: 200
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            max_tokens: 512
            temperature: 0.3
          mode: chat
          name: gpt-4o-mini
          provider: openai
        prompt_template:
        - id: 5b0e2f1a-0000-4000-8000-0000000000b1
          role: system
          text: '검색 결과를 세 줄로 요약한다. 자리 표시는 {{이름}}처럼 쓰지 않는다. 형식 예: {"요약": "..."}'
        - id: 5b0e2f1a-0000-4000-8000-0000000000b2
          role: user
          text: '검색어: {{#1720000000001.keyword#}}

            결과:

            {{#1720000000005.output#}}'
        selected: false
        title: 요약
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: '1720000000006'
      position:
        x: 1600
        y: 200
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        template: '검색 결과가 없습니다: {{ keyword }}'
        title: 결과 없음
        type: template-transform
        variables:
        - value_selector:
          - '1720000000001'
          - keyword
          variable: keyword
      height: 54
      id: '1720000000007'
      position:
        x: 1296
        y: 400
      type: custom
      width: 244
    - data:
        desc: ''
        output_type: string
        selected: false
        title: 답 고르기
        type: variable-aggregator
        variables:
        - - '1720000000006'
          - text
        - - '1720000000007'
          - output
      height: 130
      id: '1720000000008'
      position:
        x: 1904
        y: 282
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - '1720000000008'
          - output
          variable: summary
        - value_selector:
          - '1720000000003'
          - count
          variable: count
        selected: false
        title: 끝
        type: end
      height: 116
      id: '1720000000009'
      position:
        x: 2208
        y: 282
      type: custom
      width: 244
    - data:
        author: 지우
        desc: ''
        height: 88
        selected: false
        showAuthor: true
        text: '{"root":{"children":[]}}'
        theme: blue
        title: ''
        type: ''
        width: 240
      height: 88
      id: '1720000000099'
      position:
        x: 80
        y: 80
      type: custom-note
      width: 240
    viewport:
      x: 12.5
      y: -40
      zoom: 0.7
