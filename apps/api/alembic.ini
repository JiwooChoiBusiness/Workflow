# Keep this file ASCII: alembic reads it with the locale encoding (cp949 on Korean Windows).
# Migrations run on server start or with `uv run platform migrate`.
# New revision: uv run alembic -c apps/api/alembic.ini revision --autogenerate --rev-id 0002 -m "..."
# There is no sqlalchemy.url here. env.py takes the database path from DATA_DIR in .env.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
